<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #333;
      font-size: 18px;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 120px;
    }
    .message {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      gap: 15px;
      line-height: 1.5;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 11px;
    }
    .text {
      white-space: pre-wrap;
      padding-top: 5px;
    }
    .generated-image {
      max-width: 500px;
      width: 100%;
      border-radius: 12px;
    }
    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, #212121 25%);
    }
    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 8px;
      background: #2f2f2f;
      border: 1px solid #555;
      border-radius: 15px;
      padding: 8px;
    }
    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
      height: 45px;
      font-family: inherit;
    }
    button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 18px;
    }
    button:hover { background: #ddd; }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>

<body>
<header>My AI</header>

<main id="chat">
  <div class="message">
    <div class="avatar">AI</div>
    <div class="text">Hi! I'm your AI assistant. Ask me something or use 🖼️ to generate an image.</div>
  </div>
</main>

<div class="input-area">
  <div class="input-box">
    <textarea id="messageInput" placeholder="Message My AI..."></textarea>
    <button id="imageButton" title="Generate image">🖼️</button>
    <button id="sendButton" title="Send">↑</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const imageButton = document.getElementById("imageButton");

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = type === "user" ? "You" : "AI";

  const content = document.createElement("div");
  content.className = "text";
  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function addImage(imageData) {
  const message = document.createElement("div");
  message.className = "message";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "AI";

  const image = document.createElement("img");
  image.className = "generated-image";
  image.src = imageData;
  image.alt = "AI generated image";

  message.appendChild(avatar);
  message.appendChild(image);
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(generateImage = false) {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  button.disabled = true;
  imageButton.disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: message,
        generateImage: generateImage
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    if (data.image) {
      addImage(data.image);
    } else if (data.reply) {
      addMessage(data.reply, "ai");
    }
  } catch (error) {
    addMessage("Error: " + error.message, "ai");
  }

  button.disabled = false;
  imageButton.disabled = false;
  input.focus();
}

button.addEventListener("click", () => sendMessage(false));
imageButton.addEventListener("click", () => sendMessage(true));

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage(false);
  }
});
</script>
</body>
</html>
