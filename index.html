<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #333;
      font-size: 18px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 120px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      gap: 15px;
      line-height: 1.5;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #444;
      font-size: 11px;
    }

    .user .avatar { background: #555; }

    .text {
      white-space: pre-wrap;
      padding-top: 5px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, #212121 25%);
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      background: #2f2f2f;
      border: 1px solid #555;
      border-radius: 15px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
      height: 45px;
      font-family: inherit;
    }

    button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 18px;
    }

    button:hover { background: #ddd; }
  </style>
</head>

<body>
  <header>My AI</header>

  <main id="chat">
    <div class="message">
      <div class="avatar">AI</div>
      <div class="text">Hi! I'm your AI assistant. How can I help?</div>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea id="messageInput" placeholder="Message My AI..."></textarea>
      <button id="sendButton" aria-label="Send">↑</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = type === "user" ? "You" : "AI";

      const content = document.createElement("div");
      content.className = "text";
      content.textContent = text;

      message.appendChild(avatar);
      message.appendChild(content);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(
          "I received your message! The AI connection hasn't been added yet. Next, we'll connect this interface to an AI backend.",
          "ai"
        );
      }, 500);
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
