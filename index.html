<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chat</title>

  <style>
    body {
      margin: 0;
      background: #212121;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #444;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 12px 16px;
      margin: 10px auto;
      max-width: 700px;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .user {
      background: #343541;
    }

    .ai {
      background: #2b2b2b;
    }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 15px;
      max-width: 700px;
      width: calc(100% - 30px);
      margin: auto;
    }

    textarea {
      flex: 1;
      background: #303030;
      color: white;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      resize: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>My AI Chat</header>

<div id="chat">
  <div class="message ai">
    Hi! I'm your AI assistant. How can I help?
  </div>
</div>

<div id="inputArea">
  <textarea id="message" placeholder="Message your AI..." rows="1"></textarea>

  <button onclick="generateImage()">🖼️</button>

  <button onclick="sendMessage()">↑</button>
</div>

<script>

const API_URL = "/api/chat";

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  document.getElementById("chat").appendChild(message);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}


async function sendMessage() {

  const input = document.getElementById("message");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  const thinking = document.createElement("div");

  thinking.className = "message ai";

  thinking.textContent = "Thinking...";

  document.getElementById("chat").appendChild(thinking);

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        generateImage: false
      })

    });

    const data = await response.json();

    thinking.remove();

    if (data.reply) {
      addMessage(data.reply, "ai");
    } else {
      addMessage(data.error || "Something went wrong.", "ai");
    }

  } catch (error) {

    thinking.textContent =
      "The AI server could not be reached.";

  }
}


async function generateImage() {

  const input = document.getElementById("message");

  const text = input.value.trim();

  if (!text) return;

  addMessage("🖼️ " + text, "user");

  input.value = "";

  const thinking = document.createElement("div");

  thinking.className = "message ai";

  thinking.textContent = "Generating image...";

  document.getElementById("chat").appendChild(thinking);

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        generateImage: true
      })

    });

    const data = await response.json();

    thinking.remove();

    if (data.image) {

      const image = document.createElement("img");

      image.src = data.image;

      image.style.maxWidth = "700px";
      image.style.width = "100%";
      image.style.borderRadius = "12px";

      document.getElementById("chat").appendChild(image);

    } else {

      addMessage(
        data.error || "The image could not be generated.",
        "ai"
      );

    }

  } catch (error) {

    thinking.textContent =
      "The image server could not be reached.";

  }
}


document.getElementById("message").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
